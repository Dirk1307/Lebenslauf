<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:100 1000;src:url('{{sans}}') format('woff2')}
@font-face{font-family:'DM Serif Display';font-style:italic;font-weight:400;src:url('{{serif}}') format('woff2')}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f8faf8;color:#121820;font-family:'DM Sans',sans-serif}
.card{position:relative;display:grid;grid-template-columns:1fr 340px;gap:48px;width:100%;height:100%;padding:54px 62px;isolation:isolate}
.lines{position:absolute;right:-100px;top:-130px;width:660px;height:660px;z-index:-1;color:#a8b6ff}
.copy{align-self:center;min-width:0}.identity{display:flex;align-items:center;gap:15px;margin-bottom:40px;font-size:32px;font-weight:800;letter-spacing:-.035em}
.mark{display:grid;place-items:center;width:47px;height:47px;border-radius:14px;background:#3449eb;color:white;font-size:17px;transform:rotate(-7deg)}
h1{margin:0;font-size:71px;line-height:1.08;letter-spacing:-.055em;font-weight:800}.serif{color:#3449eb;font-family:'DM Serif Display',serif;font-style:italic;font-weight:400}
.position{margin:27px 0 0;font-size:23px;line-height:1.5;color:#43505e;letter-spacing:-.015em}.address{display:block;margin-top:33px;color:#43505e;font-size:17px}
.portrait{position:relative;align-self:center;height:470px;isolation:isolate}.portrait::before{content:'';position:absolute;inset:-12px -14px 8px 12px;border-radius:48% 48% 20px 20px;background:#d3e1ff;transform:rotate(-4deg);z-index:-1}
.portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:44% 36%;border-radius:48% 48% 20px 20px}
.note{position:absolute;left:-28px;bottom:28px;padding:16px 22px;background:#dfff82;color:#122124;border-radius:3px;font-size:20px;font-weight:800;letter-spacing:-.035em;transform:rotate(-7deg)}
</style>
</head>
<body><main class="card">
<svg class="lines" viewBox="0 0 660 660" aria-hidden="true"><g fill="none" stroke="currentColor"><circle cx="330" cy="330" r="200"/><circle cx="330" cy="330" r="260"/><circle cx="330" cy="330" r="320"/><path d="M0 370Q300 180 660 340"/></g></svg>
<div class="copy"><div class="identity"><span class="mark">DH</span><span>{{name}}</span></div><h1>Klar denken.<br><span class="serif">Weiter</span> machen.</h1><p class="position">Marketing · Performance · Projekte</p><span class="address">{{host}}</span></div>
<div class="portrait"><img src="{{portrait}}" alt="{{name}}"><span class="note">Hi, ich bin Dirk.</span></div>
</main></body>
</html>
